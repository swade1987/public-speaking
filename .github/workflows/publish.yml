name: Publish

# Merge to main is the publish gate - no separate manual step. Same
# R2 bucket/Worker as swade1987/slides, own publish script since this
# repo has no manifest/build pipeline (one static page).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/publish-r2.js'
      - '.github/workflows/publish.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
      - name: Publish to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/publish-r2.js site speaking
